name: Build Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== Gradle files ==="
          find . -maxdepth 2 -type f \( -name "gradlew" -o -name "settings.gradle*" -o -name "build.gradle*" \) -print

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is empty"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

          if [ ! -s upload-keystore.jks ]; then
            echo "Keystore file is empty"
            exit 1
          fi

          echo "Keystore decoded successfully"

      - name: Read keystore alias
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          KEY_ALIAS=$(keytool -list \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -v 2>/dev/null \
            | grep -m 1 "Alias name:" \
            | sed 's/.*Alias name:[[:space:]]*//')

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Could not find keystore alias"
            echo "Check STORE_PASSWORD and KEYSTORE_BASE64"
            exit 1
          fi

          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "Keystore alias found"

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Using Gradle wrapper"
          else
            echo "ERROR: gradlew is missing from the project"
            exit 1
          fi

      - name: Clean project
        run: |
          ./gradlew clean --no-daemon

      - name: Build Release AAB
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Find AAB
        run: |
          AAB=$(find . -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB file was not created"
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB"

          echo "AAB_FILE=$AAB" >> "$GITHUB_ENV"

      - name: Sign AAB
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

      - name: Verify AAB
        run: |
          jarsigner -verify -verbose "$AAB_FILE"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: ${{ env.AAB_FILE }}
          if-no-files-found: error
