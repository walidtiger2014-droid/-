name: Build Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          test -s upload-keystore.jks

      - name: Get keystore alias
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          export LC_ALL=C
          ALIAS=$(keytool -list -v \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" 2>/dev/null \
            | grep "Alias name:" \
            | head -n 1 \
            | sed 's/.*Alias name: //')

          if [ -z "$ALIAS" ]; then
            echo "Could not find keystore alias"
            exit 1
          fi

          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build Release AAB
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          gradle bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: |
            **/build/outputs/bundle/release/*.aab
          if-no-files-found: error
