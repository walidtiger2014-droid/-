name: Build Signed Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      # 1) تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2) إعداد Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3) تثبيت Gradle مباشرة
      #    لا نعتمد على ./gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # 4) فك تشفير ملف مفتاح التوقيع
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

          if [ ! -s my-upload-key.jks ]; then
            echo "ERROR: Keystore file is empty"
            exit 1
          fi

          echo "Keystore decoded successfully"

      # 5) التأكد من أن كلمة مرور مخزن المفاتيح صحيحة
      - name: Check signing keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD is missing"
            exit 1
          fi

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD"

          echo "Keystore password is correct"

      # 6) التأكد أن Alias = upload موجود فعلًا
      - name: Check signing alias
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload

          echo "Alias 'upload' found successfully"

      # 7) بناء AAB موقع
      - name: Build signed Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          set -e

          echo "Starting signed Release AAB build..."

          gradle clean bundleRelease --stacktrace

      # 8) البحث عن ملف AAB
      - name: Find AAB
        run: |
          set -e

          AAB_FILE=$(find . \
            -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not created"
            exit 1
          fi

          echo "Found AAB:"
          echo "$AAB_FILE"

          mkdir -p release

          cp "$AAB_FILE" release/app-release.aab

      # 9) التحقق من توقيع الـAAB
      - name: Verify AAB
        run: |
          set -e

          jarsigner -verify \
            -verbose \
            release/app-release.aab

          echo "AAB signature verification completed"

      # 10) رفع الـAAB كملف يمكن تحميله
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: release/app-release.aab
          if-no-files-found: error
