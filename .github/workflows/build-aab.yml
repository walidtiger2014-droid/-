name: Build Signed Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

          if [ ! -s upload-keystore.jks ]; then
            echo "ERROR: Keystore file is empty"
            exit 1
          fi

          echo "Keystore decoded successfully"

      - name: Find keystore alias
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing"
            exit 1
          fi

          echo "Checking keystore..."

          keytool -list \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -v > keystore-info.txt

          echo "Keystore information:"
          grep "Alias name:" keystore-info.txt || true

          KEY_ALIAS=$(grep "Alias name:" keystore-info.txt | head -n 1 | sed 's/.*Alias name: //' | xargs)

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: No alias was found in the keystore"
            echo "The keystore may have the wrong password or contain no key."
            exit 1
          fi

          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          echo "Using alias: $KEY_ALIAS"

      - name: Build Release AAB
        run: |
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --stacktrace

      - name: Find AAB
        run: |
          set -e

          AAB_FILE=$(find . -type f -path "*/build/outputs/bundle/release/*.aab" | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not created"
            find . -type f -name "*.aab" -print
            exit 1
          fi

          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"
          echo "Found AAB: $AAB_FILE"

      - name: Sign AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs "$AAB_FILE"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: ${{ env.AAB_FILE }}
          if-no-files-found: error
