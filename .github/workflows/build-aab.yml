name: Build Signed Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

          test -s upload-keystore.jks || {
            echo "ERROR: Keystore file is empty"
            exit 1
          }

          echo "Keystore OK"

      - name: Check keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          test -n "$STORE_PASSWORD" || {
            echo "ERROR: STORE_PASSWORD is missing"
            exit 1
          }

          keytool -list \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD"

          echo "Keystore password is correct"

      - name: Get keystore alias
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          KEY_ALIAS=$(keytool -list \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            | awk -F',' 'NR > 1 && $1 != "" {print $1; exit}')

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: No alias found in keystore"
            exit 1
          fi

          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          echo "Alias found successfully"

      - name: Build Release AAB
        run: |
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --stacktrace

      - name: Find AAB
        run: |
          set -e

          AAB_FILE=$(find . \
            -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB file was not created"
            exit 1
          fi

          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"

          echo "AAB found"

      - name: Sign AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

      - name: Verify AAB
        run: |
          jarsigner -verify -verbose "$AAB_FILE"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: ${{ env.AAB_FILE }}
          if-no-files-found: error
