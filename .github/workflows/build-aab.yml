name: Build Signed Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

          if [ ! -s my-upload-key.jks ]; then
            echo "ERROR: Keystore file is empty"
            exit 1
          fi

          echo "Keystore decoded successfully"

      - name: Check signing key
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD is missing"
            exit 1
          fi

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD"

          echo "Keystore password is correct"

      - name: Build signed Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew clean bundleRelease --stacktrace

      - name: Find AAB
        run: |
          set -e

          AAB_FILE=$(find . \
            -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not created"
            exit 1
          fi

          echo "Found AAB: $AAB_FILE"

          mkdir -p release

          cp "$AAB_FILE" release/app-release.aab

      - name: Verify AAB
        run: |
          set -e

          jarsigner -verify -verbose release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: release/app-release.aab
          if-no-files-found: error
