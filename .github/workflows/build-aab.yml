name: Build Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:

      # 1 - تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2 - Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3 - إعداد Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 4 - عرض ملفات المشروع
      - name: Check Project
        run: |
          echo "===== PROJECT ====="
          pwd
          ls -la

          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

      # 5 - فك ملف التوقيع
      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

          if [ ! -s upload-keystore.jks ]; then
            echo "ERROR: upload-keystore.jks is empty"
            exit 1
          fi

          echo "Keystore decoded successfully."

      # 6 - التأكد من كلمة مرور المتجر واستخراج Alias
      - name: Read Keystore Alias
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD is empty"
            exit 1
          fi

          echo "Checking keystore..."

          keytool \
            -J-Duser.language=en \
            -J-Duser.country=US \
            -list \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD"

          echo "Finding alias..."

          KEY_ALIAS=$(
            keytool \
              -J-Duser.language=en \
              -J-Duser.country=US \
              -list \
              -v \
              -keystore upload-keystore.jks \
              -storepass "$STORE_PASSWORD" 2>/dev/null \
            | awk -F': ' '/Alias name:/ {print $2; exit}'
          )

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Could not find keystore alias."
            echo "The keystore password may be wrong or the keystore is invalid."
            exit 1
          fi

          echo "Keystore alias found."

          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      # 7 - تنظيف المشروع
      - name: Clean
        run: |
          gradle clean --no-daemon

      # 8 - بناء Release AAB
      - name: Build Release AAB
        run: |
          gradle bundleRelease --no-daemon --stacktrace

      # 9 - البحث عن ملف AAB
      - name: Find AAB
        run: |
          set -e

          echo "Searching for AAB..."

          AAB_FILE=$(find . \
            -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: No AAB file was created."
            echo "===== ALL AAB FILES ====="
            find . -type f -name "*.aab" -print
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB_FILE"

          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"

      # 10 - توقيع AAB
      - name: Sign AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Signing AAB..."

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          echo "AAB signed successfully."

      # 11 - التحقق من التوقيع
      - name: Verify AAB
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            "$AAB_FILE"

          echo "AAB signature verified successfully."

      # 12 - رفع ملف AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: ${{ env.AAB_FILE }}
          if-no-files-found: error
