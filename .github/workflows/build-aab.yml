name: Build Signed Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:

      # 1) تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2) إعداد Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) إعداد Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4) فك ملف التوقيع
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

          if [ ! -s upload-keystore.jks ]; then
            echo "ERROR: Keystore file is empty"
            exit 1
          fi

          echo "Keystore decoded successfully"

      # 5) التأكد من بيانات التوقيع
      - name: Verify signing configuration
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing"
            exit 1
          fi

          keytool -list \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Signing configuration verified successfully"

      # 6) بناء نسخة Release
      - name: Build Release AAB
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --stacktrace

      # 7) البحث عن ملف AAB
      - name: Find Release AAB
        run: |
          set -e

          AAB_FILE=$(find . \
            -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not created"
            exit 1
          fi

          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$AAB_FILE"

      # 8) توقيع AAB
      - name: Sign Release AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          echo "AAB signed successfully"

      # 9) التحقق من التوقيع
      - name: Verify AAB Signature
        run: |
          set -e

          jarsigner -verify -verbose "$AAB_FILE"

          echo "AAB signature verified successfully"

      # 10) رفع ملف AAB
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: ${{ env.AAB_FILE }}
          if-no-files-found: error
