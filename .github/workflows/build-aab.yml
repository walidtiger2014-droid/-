name: Build Signed Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:

      # 1) تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4


      # 2) Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # 3) إعداد Gradle 9.3.1
      # Android Gradle Plugin 9.1.1 يحتاج Gradle 9.3.1 أو أحدث
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'


      # 4) فك ملف التوقيع
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

          if [ ! -s my-upload-key.jks ]; then
            echo "ERROR: Keystore file is empty"
            exit 1
          fi

          echo "Keystore decoded successfully"


      # 5) التأكد أن مخزن المفاتيح يفتح
      - name: Check signing keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD is missing"
            exit 1
          fi

          keytool -list \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD"

          echo "Keystore password is correct"


      # 6) التأكد من Alias = upload ومن كلمة مرور المفتاح
      - name: Verify upload signing key
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing"
            exit 1
          fi

          echo "Checking signing alias: upload"

          keytool -list \
            -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            -keypass "$KEY_PASSWORD"

          echo "UPLOAD KEY VERIFIED SUCCESSFULLY"


      # 7) بناء Release AAB موقّع
      - name: Build signed Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          set -e

          echo "Starting signed Release AAB build..."

          gradle clean bundleRelease --stacktrace

          echo "Release AAB build completed"


      # 8) البحث عن ملف AAB
      - name: Find AAB
        run: |
          set -e

          AAB_FILE=$(find . \
            -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not created"
            exit 1
          fi

          echo "Found AAB:"
          echo "$AAB_FILE"

          mkdir -p release

          cp "$AAB_FILE" release/app-release.aab


      # 9) التحقق من توقيع AAB
      - name: Verify AAB signature
        run: |
          set -e

          echo "Verifying AAB signature..."

          jarsigner -verify \
            -verbose \
            release/app-release.aab

          echo "AAB signature verified successfully"


      # 10) رفع AAB كملف قابل للتحميل
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: release/app-release.aab
          if-no-files-found: error
